<title>FDE POD Operating Model</title>

<style>
:root{--bg:#f6f3ec;--paper:#fffdf8;--line:#e2dbcd;--line2:#cfc6b4;--text:#1f2635;--muted:#5a6273;--ink:#1f2b45;--signal:#b0463a;--value:#b0731c;--eng:#2a6b8a;--trans:#7a4d8a;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#16191f;--paper:#1d2128;--line:#30353f;--line2:#3d434e;--text:#e9e6df;--muted:#a8acb4;--ink:#e9e6df;--signal:#e07a6c;--value:#e0a44d;--eng:#6fb3d2;--trans:#b48cc4;color-scheme:dark}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.card{width:100%;max-width:420px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:36px 32px 30px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--value) 0 33.3%,var(--eng) 33.3% 66.6%,var(--trans) 66.6%)}
.kicker{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--signal);font-weight:600}
h1{font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:28px;line-height:1.15;margin:10px 0 10px;color:var(--ink)}
p{color:var(--muted);font-size:14.5px;line-height:1.55}
label{display:block;margin-top:26px;font-size:12.5px;font-weight:600;color:var(--text)}
input{width:100%;margin-top:6px;font:500 16px/1.2 "IBM Plex Sans",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--text);background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:12px 14px}
input:focus{outline:2px solid var(--eng);outline-offset:1px;border-color:transparent}
button{width:100%;margin-top:14px;font:600 15px "IBM Plex Sans",sans-serif;color:var(--paper);background:var(--ink);border:0;border-radius:8px;padding:12px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{min-height:20px;margin-top:10px;font-size:13.5px;color:var(--signal)}
.fine{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
</style>
</head>

const STORE = 'fde-access', VID = 'fde-visitor';
const dec = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const norm = s => s.toUpperCase().replace(/[^A-Z0-9]/g, '');
const esc = s => String(s).replace(/[&<>"'\\]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','\\':'&#92;'}[m]));
const get = k => { try { return localStorage.getItem(k) } catch (e) { return null } };
const put = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v) } catch (e) {} };

function visitor() {
  let v = get(VID);
  if (!v) { v = Math.random().toString(36).slice(2, 10) + Date.now().toString(36); put(VID, v); }
  return v;
}

function log(event, client) {
  if (!P.log) return;
  const body = JSON.stringify({
    event, client: client || '', visitor: visitor(),
    tz: Intl.DateTimeFormat().resolvedOptions().timeZone || '', lang: navigator.language || '',
    screen: screen.width + 'x' + screen.height, ua: navigator.userAgent, ref: document.referrer
  });
  const blob = new Blob([body], { type: 'text/plain' });
  if (!(navigator.sendBeacon && navigator.sendBeacon(P.log, blob)))
    fetch(P.log, { method: 'POST', mode: 'no-cors', body, keepalive: true }).catch(() => {});
}

async function unlock(code) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm(code)), 'PBKDF2', false, ['deriveKey']);
  const wrap = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: dec(P.salt), iterations: P.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  for (const k of P.keys) {
    try {
      const inner = JSON.parse(new TextDecoder().decode(
        await crypto.subtle.decrypt({ name: 'AES-GCM', iv: dec(k.iv) }, wrap, dec(k.ct))));
      const ck = await crypto.subtle.importKey('raw', dec(inner.k), 'AES-GCM', false, ['decrypt']);
      const html = new TextDecoder().decode(
        await crypto.subtle.decrypt({ name: 'AES-GCM', iv: dec(P.content.iv) }, ck, dec(P.content.ct)));
      return { client: inner.c, html };
    } catch (e) { /* not this entry */ }
  }
  return null;
}

function show(r) {
  const html = r.html.split('__CLIENT__').join(esc(r.client));
  document.open(); document.write(html); document.close();
}

const f = document.getElementById('f'), go = document.getElementById('go'), err = document.getElementById('err');
f.addEventListener('submit', async e => {
  e.preventDefault();
  const code = document.getElementById('code').value;
  go.disabled = true; go.textContent = 'Checking…'; err.textContent = '';
  const r = await unlock(code);
  if (r) { put(STORE, norm(code)); log('login', r.client); show(r); return; }
  log('failed');
  go.disabled = false; go.textContent = 'Open briefing';
  err.textContent = 'That code is not valid. Check it and try again, or contact us for a new one.';
});

(async () => {
  const saved = get(STORE);
  if (!saved) return;
  const r = await unlock(saved);
  if (r) { log('return', r.client); show(r); } else put(STORE, null);
})();
})();
